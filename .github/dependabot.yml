# Weekly update PRs for the dev dependencies in package.json and for the GitHub Actions in .github/workflows.
# The plugin itself ships no npm runtime dependencies; the optional vectors runtime is pinned in
# plugin/compact/recall/runtime-lock.json and is updated by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
